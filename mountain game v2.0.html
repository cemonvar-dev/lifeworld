<!DOCTYPE html>
<html>
<head>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

<style>

  body { font-family: Arial; }
  #grid {
    display: grid;
    grid-template-columns: repeat(6, 150px);
    grid-template-rows: repeat(6, 150px);
    gap: 4px;
    margin: 20px;
  }
  .tile {
    width:150px;
    height:150px;
    background:#f0f0f0;
    border:1px solid #ccc;
    position:relative;
	user-select:none;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24pt;
  }

  /* Tile name in corner */
  .tileName {
    position:absolute;
    top:5px;
    right:5px;
    font-size:12px;
    color:#333;
    font-weight:bold;
  }

  #popup {
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:20px;
    border:2px solid black;
    display:none;
    width:300px;
  }
  #overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.3);
    display:none;
  }
  label {
    font-weight:bold;
  }
  input, textarea {
    width:100%;
    margin-bottom:10px;
  }
</style>

</head>

<body>

<div id="grid"></div>

<div id="overlay"></div>

<div id="popup">
  <h3>Tile Details</h3>

  <label>Tile Name</label>
  <input type="text" id="tileNameInput">

  <label>Log Entry</label>
  <textarea id="entryText" rows="4"></textarea>
<div id="historyBox" 
     style="max-height:120px; overflow-y:auto; border:1px solid #ccc; padding:5px; margin-bottom:10px; font-size:12px;">
</div>

  <button id="saveBtn">Save</button>
  <button id="cancelBtn">Cancel</button>
</div>

<script>

let tiles = {};
let activeIndex = null;

// Load from localStorage if exists
if(localStorage.getItem("lifeworld")){
    tiles = JSON.parse(localStorage.getItem("lifeworld"));
} else {
    for(let i=0;i<36;i++){
      tiles[i] = { name:"", logs:[], lastUpdate:null };
    }
}

function renderTiles(){
  $("#grid").empty();
  for(let i=0;i<36;i++){
    $("#grid").append(`
      <div class='tile' data-index='${i}'>
        <div class="tileName">${tiles[i].name || ""}</div>
        <div class="count">${tiles[i].logs.length}</div>
        <div class="timestamp" style="position:absolute; bottom:5px; right:5px; font-size:10px; color:#555;">
          ${tiles[i].lastUpdate || ""}
        </div>
      </div>
    `);

    updateTileColor(i);
  }
}

let hoverTarget = null;
let hoverTimer = null;

// Enable dragging
$(document).on("mousedown", ".tile", function(){
  $(this).draggable({
    start: function(){
      $(this).css("z-index", 9999);
    },
    drag: function(event, ui){
      let elementUnder = document.elementFromPoint(event.clientX, event.clientY);

      if(!elementUnder) return;

      let $target = $(elementUnder).closest(".tile");
      if($target.length === 0) return;

      let targetIndex = $target.data("index");
      let draggedIndex = $(this).data("index");

      // Prevent self-triggering
      if(targetIndex === draggedIndex) return;

      // Reset timer if hovering different tile
      if(hoverTarget !== targetIndex){
        hoverTarget = targetIndex;
        clearTimeout(hoverTimer);

        // Start hover timer
        hoverTimer = setTimeout(() => {
          swapTiles(draggedIndex, targetIndex);
          renderTiles(); // redraw tiles after swap
        }, 1000); // 1 second hover
      }
    },
    stop: function(){
      $(this).css("z-index", "");
      clearTimeout(hoverTimer);
    }
  });
});


function swapTiles(a, b){
  // swap data in memory
  let temp = tiles[a];
  tiles[a] = tiles[b];
  tiles[b] = temp;

  localStorage.setItem("lifeworld", JSON.stringify(tiles));

  // update only the two affected tiles visually
  updateTileUI(a);
  updateTileUI(b);
}

function updateTileUI(i){
  let tile = $(`.tile[data-index='${i}']`);
  tile.find(".tileName").text(tiles[i].name);
  tile.find(".count").text(tiles[i].logs.length);
  tile.find(".timestamp").text(tiles[i].lastUpdate || "");
  updateTileColor(i);
}




// Click tile (delegated)
$(document).on("click", ".tile", function(){
  activeIndex = $(this).data("index");

  $("#tileNameInput").val(tiles[activeIndex].name);
  $("#entryText").val("");

  // 🔥 Show history
  let logs = tiles[activeIndex].logs;
  if(logs.length > 0){
    $("#historyBox").html(
      logs.map((l, i) => `<div>• ${l}</div>`).join("")
    );
  } else {
    $("#historyBox").html("<div style='color:#888;'>No history yet</div>");
  }

  $("#overlay").show();
  $("#popup").show();

  // 🔥 Smart focus
  if(!tiles[activeIndex].name || tiles[activeIndex].name.trim() === ""){
    $("#tileNameInput").focus();
  } else {
    $("#entryText").focus();
  }
});





// Save
$("#saveBtn").click(function(){
  let name = $("#tileNameInput").val().trim();
  let txt = $("#entryText").val().trim();

  tiles[activeIndex].name = name;
  $(`.tile[data-index='${activeIndex}'] .tileName`).text(name);

  if(txt.length>0){
    tiles[activeIndex].logs.push(txt);
  }

  let now = new Date().toLocaleString();
  tiles[activeIndex].lastUpdate = now;
  $(`.tile[data-index='${activeIndex}'] .timestamp`).text(now);

  let count = tiles[activeIndex].logs.length;
  let randomColor = `hsl(${Math.random()*360},70%,50%)`;

  $(`.tile[data-index='${activeIndex}'] .count`)
    .text(count)
    .css("color", randomColor);

  // Update visual background
  updateTileColor(activeIndex);

  // Save to localStorage
  localStorage.setItem("lifeworld", JSON.stringify(tiles));

  $("#popup").hide();
  $("#overlay").hide();
  $("#historyBox").empty();
});

// Cancel
$("#cancelBtn").click(function(){
  $("#popup").hide();
  $("#overlay").hide();
  $("#historyBox").empty();
});


// 🔥 TILE COLORING FUNCTION
function updateTileColor(index){
  let count = tiles[index].logs.length;
  let $tile = $(`.tile[data-index='${index}']`);

  if(count === 0){
    $tile.css("background", "#e0e0e0");
  }
  else if(count >= 1 && count <= 3){
    $tile.css("background", "#fff6b3"); // pastel yellow
  }
  else if(count >= 4 && count <= 8){
    $tile.css("background", "#c7f7c0"); // soft green
  }
  else if(count >= 9 && count <= 15){
    $tile.css("background", "#b6d9ff"); // soft blue
  }
  else if(count > 15){
    $tile.css("background", "linear-gradient(135deg, #ff9a9e, #fad0c4)");
  }
}

$(document).ready(function() {
  renderTiles();

  // Enable dragging after render
  $(".tile").draggable({
    revert: "invalid"
  });
});



</script>

</body>
</html>
