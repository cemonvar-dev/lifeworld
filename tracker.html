<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10, user-scalable=yes">
  <title>My World</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <link rel="stylesheet" href="/styling/styling.css">
  <link rel="stylesheet" href="/styling/agenda.css">
  <link rel="stylesheet" href="/styling/header.css">
  <link rel="stylesheet" href="/styling/tag.css">
  <link rel="stylesheet" href="/styling/tiledetail.css">
  <link rel="stylesheet" href="/styling/mobile.css">
  <link rel="stylesheet" href="/styling/grayed.css">

  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
</head>

<body>
  <header id="topHeader">
    <div class="left" style="display:flex; align-items:center; gap:10px;">
      <img src="logo.png" alt="My World Logo" style="height:32px;">
    </div>
            <input
    type="text"
    id="searchBox"
    placeholder="what are you working on?"
    style="width: 200px;height: 24px;"
  />
      <div style="display:flex; align-items:center; gap:10px;">
        <input
          type="text"
          id="searchBox"
          placeholder="what are you working on?"
          style="width: 200px;height: 24px;"
        />
        <div class="tagDropdown">
          <button id="tagDropdownBtn" type="button">Tags ▼</button>
          <div id="tagDropdownMenu" class="tagDropdownMenu">
            <div class="tagBtn" data-tag="arts">🎨 Arts</div>
            <div class="tagBtn" data-tag="cooking">🍳 Cooking</div>
            <div class="tagBtn" data-tag="family">👨‍👩‍👧‍👦 Family</div>
            <div class="tagBtn" data-tag="friends">🤝 Friends</div>
            <div class="tagBtn" data-tag="games">🎮 Games</div>
            <div class="tagBtn" data-tag="habit">🔥 Habit</div>
            <div class="tagBtn" data-tag="health">💚 Health</div>
            <div class="tagBtn" data-tag="hobby">🎯 Hobby</div>
            <div class="tagBtn" data-tag="home">🏡 Home</div>
            <div class="tagBtn" data-tag="learning">📚 Learning</div>
            <div class="tagBtn" data-tag="outdoor">🌲 Outdoor</div>
            <div class="tagBtn" data-tag="spirituality">✨ Spirituality</div>
            <div class="tagBtn" data-tag="work">💼 Work</div>
          </div>
        </div>
      </div>
    <div class="right">
  
      <div id="profileWrapper">
 
        <!-- Profile Icon -->
        <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" id="profileIcon">

        <!-- Profile Menu -->
        <div id="profileMenu" style="margin-bottom: 12px;">
          <div id="profileEmail"></div>
          <button id="resetFlagsBtn" class="settingsItem">Reset flags</button>
          <button class="settingsItem" id="menuLoginBtn">Login</button>
          <button class="settingsItem" id="menuLogoutBtn">Logout</button>
        </div>


      </div>
    </div>
  </header>

  <!-- Theme Popup OUTSIDE both menus -->
  <div id="themePopup">
    <h3>Select Theme</h3>

    <div class="themeOption" data-theme="light">🌞 Light</div>
    <div class="themeOption" data-theme="dark">🌙 Dark</div>
    <div class="themeOption" data-theme="forest">🌲 Forest</div>
    <div class="themeOption" data-theme="ocean">🌊 Ocean</div>
    <div class="themeOption" data-theme="galaxy">✨ Galaxy</div>

    <button id="closeThemePopup">Close</button>
  </div>

  <div id="topIntentRow">
 

  
  <div id="tagBar">
    <!-- tagBar removed, replaced by dropdown -->
  </div>
  
</div>
 

  <div id="timelineFilter">
    <div class="tItem" data-filter="today">
      <div class="dot"></div>
      <span>Today</span>
    </div>

    <div class="tItem" data-filter="1">
      <div class="dot"></div>
      <span>Tomorrow</span>
    </div>

    <div class="tItem" data-filter="2">
      <div class="dot"></div>
      <span>In 2 days</span>
    </div>

    <div class="tItem" data-filter="3plus">
      <div class="dot"></div>
      <span>3 days+</span>
    </div>

    <div class="tItem" data-filter="all">
      <div class="dot"></div>
      <span>All</span>
    </div>
  </div>

   <div>
 
  
  <div id="quickFilters" style="display:flex; gap:8px; align-items:center; margin-left:12px;">
   
<button id="filterDoneBtn" class="qfBtn" title="Done">💪</button>
<button id="filterSkippedBtn" class="qfBtn" title="Skipped">😢</button>
<button id="filterNoActionBtn" class="qfBtn" title="No Action">💬</button>

  </div>
</div>  


  <div id="grid"></div>
  <div id="overlay"></div>
  <div id="popup">

    <div id="popupButtons">
      <h3 id="tileTitle" contenteditable="true" class="editableTitle" data-placeholder="Enter your tile name here"
        style="width: 50%;margin-bottom: 12px;margin-top: 0px;"></h3>
      <button id="saveBtn" style="position: absolute;right: 145px;">💾</button>
      <button id="deleteTileBtn" style="position: absolute;right: 80px;">🗑️</button>
      <button id="cancelBtn" style="position: absolute;right: 12px;">✕</button>
    </div>

    <!-- NEW FREQUENCY CONTROL -->
    <div id="frequencyControl">
      <div id="freqOptions">
        <label>
          <input type="radio" name="freqMode" value="daily"> Daily
        </label>
        <label>
          <input type="radio" name="freqMode" value="custom"> Custom Days
        </label>
        <label>
          <input type="radio" name="freqMode" value="pickdate"> Pick Date
        </label>
      </div>

      <!-- Custom Days container remains the same -->
      <div id="customDays" style="margin-top:6px; display:none;">
        <button class="dayBtn" data-day="Mon">Mon</button>
        <button class="dayBtn" data-day="Tue">Tue</button>
        <button class="dayBtn" data-day="Wed">Wed</button>
        <button class="dayBtn" data-day="Thu">Thu</button>
        <button class="dayBtn" data-day="Fri">Fri</button>
        <button class="dayBtn" data-day="Sat">Sat</button>
        <button class="dayBtn" data-day="Sun">Sun</button>
      </div>

      <!-- NEW: Date picker container -->
      <div id="pickDateContainer" style="margin-top:6px; display:none;">
        <input type="date" id="pickDateInput" style="padding:5px; font-size:14px;">
      </div>
    </div>
    <div id="popupLeft" height="50%">
      <div id="tagSelector" style="margin-top:20px">
        <div id="tagSelectorButtons"></div>
      </div>
      <div id="timeOfDaySelector" style="margin-top:12px; display:flex; gap:8px;">
        <button class="timeOfDayBtn" data-time="morning">🌅 Morning</button>
        <button class="timeOfDayBtn" data-time="evening">🌙 Evening</button>
      </div>
      <div class="toggleRow">
        <label class="switch">
          <input type="checkbox" id="doneToggle">
          <span class="slider round"></span>
        </label>
        <span class="toggleLabel">Mark as done</span>
      </div>
      <!-- Skip toggle (ABOVE buttons) -->
      <div class="toggleRow" id="skipRow">
        <label class="switch">
          <input type="checkbox" id="skipToggle">
          <span class="slider round"></span>
        </label>
        <span class="toggleLabel">Skip this turn</span>
      </div>
    </div>
    <h4>History</h4>
    <div id="popupRight">
      <div id="historyBox"></div>
    </div>

  </div>


  <footer> My world v0.34 </footer>
  <script src="supa.js"></script>
  <script src="auth.js"></script>
  <script src="util.js"></script>
  <script src="script.js"></script>
  <script src="agenda.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(() => {
        console.log('Service Worker registered');
      }).catch(err => {
        console.log('Service Worker registration failed:', err);
      });
    }
  </script>

</body>

</html>
