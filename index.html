<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10, user-scalable=yes">
  <title>LifeWorld Grid</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <link rel="stylesheet" href="styling.css">
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
</head>

<body>
  <header id="topHeader">
    <div class="left" style="display:flex; align-items:center; gap:10px;">
      <img src="logo.png" alt="LifeWorld Logo" style="height:32px;">
      <span class="logo">LifeWorld</span>
    </div>
    <div class="right">
      <div id="profileWrapper">
        <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" id="profileIcon">
        <div id="profileMenu">
          <div id="profileEmail"></div>
          <button id="menuLoginBtn">Login</button>
          <button id="menuLogoutBtn">Logout</button>
        </div>
      </div>
    </div>
  </header>
  <input type="text" id="searchBox" placeholder="what are you working on?"
    style="margin: 20px 20px 10px 20px; width: 300px; padding:5px;">
  <div id="timelineFilter">
    <div class="tItem" data-filter="today">
      <div class="dot"></div>
      <span>Today</span>
    </div>

    <div class="tItem" data-filter="1">
      <div class="dot"></div>
      <span>1d</span>
    </div>

    <div class="tItem" data-filter="2">
      <div class="dot"></div>
      <span>2d</span>
    </div>

    <div class="tItem" data-filter="3plus">
      <div class="dot"></div>
      <span>3d+</span>
    </div>

    <div class="tItem" data-filter="all">
      <div class="dot"></div>
      <span>All</span>
    </div>
  </div>
  <button id="resetFlagsBtn" class="qfBtn" style="margin-left:20px;">
    Reset Done/Skipped
  </button>

  <div id="grid"></div>
  <div id="overlay"></div>
  <div id="popup">
    <h3 id="tileTitle" contenteditable="true" class="editableTitle"></h3>
    <!-- NEW FREQUENCY CONTROL -->
    <div id="frequencyControl">
      <div id="freqOptions">
        <label>
          <input type="radio" name="freqMode" value="daily">Daily</label>
        <input type="radio" name="freqMode" value="custom">Custom Days</label>
      </div>
      <div id="customDays" style="margin-top:6px; display:none;">
        <button class="dayBtn" data-day="Mon">Mon</button>
        <button class="dayBtn" data-day="Tue">Tue</button>
        <button class="dayBtn" data-day="Wed">Wed</button>
        <button class="dayBtn" data-day="Thu">Thu</button>
        <button class="dayBtn" data-day="Fri">Fri</button>
        <button class="dayBtn" data-day="Sat">Sat</button>
        <button class="dayBtn" data-day="Sun">Sun</button>
      </div>
    </div>
    <div id="popupLeft" height="50%">
      <!-- Mark as Done toggle (top) -->
      <div class="toggleRow">
        <span class="toggleLabel">Mark as done</span>
        <label class="switch">
          <input type="checkbox" id="doneToggle">
          <span class="slider round"></span>
        </label>
      </div>

      <div id="tagBar" style="margin: 10px 20px; display:flex; gap:8px; flex-wrap:wrap;">
        <div class="tagBtn" data-tag="health">💚 Health</div>
        <div class="tagBtn" data-tag="work">💼 Work</div>
        <div class="tagBtn" data-tag="learning">📚 Learning</div>
        <div class="tagBtn" data-tag="habit">🔥 Habit</div>
        <div class="tagBtn" data-tag="home">🏡 Home</div>
      </div>
    </div>

  </div>

  <!-- Notes / log text -->
  <textarea id="entryText" rows="4" style="height:70%"></textarea>

  <!-- Skip toggle (ABOVE buttons) -->
  <div class="toggleRow" id="skipRow" style="margin-top:10px;">
    <span class="toggleLabel">Skip this turn</span>
    <label class="switch">
      <input type="checkbox" id="skipToggle">
      <span class="slider round"></span>
    </label>
  </div>
  <div id="popupRight">
    <h4>History</h4>
    <div id="historyBox"></div>
  </div>
  <!-- Buttons -->
  <div id="popupButtons">
    <button id="deleteTileBtn" class="popupBtn" style="background:#ff4d4d; color:white;">Delete Tile</button>
    <button id="cancelBtn" class="popupBtn">Cancel</button>
    <button id="saveBtn" class="popupBtn">Save</button>
  </div>
  </div>
  </div>
  <footer> Lifeworld v0.3 — built with ❤️ </footer>
  <script src="supa.js"></script>
  <script src="auth.js"></script>
  <script src="util.js"></script>
  <script src="script.js"></script>
</body>

</html>
