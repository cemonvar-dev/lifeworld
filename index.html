<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LifeWorld Grid</title>

  <style>
body {
     font-family: Arial, sans-serif;
}
 #topBar {
     margin: 10px 20px;
}
 #grid {
     display: grid;
     grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
     gap: 6px;
     margin: 20px;
}
 @media (max-width: 600px) {
     .tile {
         width: 100%;
         height: 100px;
         font-size: 18pt;
    }
     .tileName {
         font-size: 10px;
    }
     .timestamp {
         font-size: 8px;
    }
}
 .tile {
     width:100%;
     aspect-ratio: 1 / 1;
    /* keeps it square automatically */
     background:#F5F5F0;
     border:1px solid #ccc;
     border-radius:6px;
     position:relative;
     cursor:pointer;
     display:flex;
     justify-content:center;
     align-items:center;
     font-size:24pt;
     user-select:none;
}

 .tileName {
     position:absolute;
     top:5px;
     right:5px;
     font-size:12px;
     color:#333;
     font-weight:bold;
     max-width: 70%;
     text-align: right;
     word-wrap: break-word;
}
 .count {
     pointer-events:none;
}
 .timestamp {
     position:absolute;
     bottom:5px;
     right:5px;
     font-size:10px;
     color:#555;
}

/* Popup layout */

 #popup {
     position:fixed;
     top:50%;
     left:50%;
     transform:translate(-50%,-50%);
     background:white;
     padding:20px;
	 border-radius:12px;
     display:none;
     width:540px;
     z-index:1001;
}

#popupContent {
  display: flex;
  gap: 20px;
}

#popupLeft {
  flex: 1;
}

#popupRight {
  width: 45%;
  max-height: 320px;
  overflow-y: auto;
  border-left: 1px solid #ddd;
  padding-left: 15px;
}

/* Timeline styling */
#historyBox {
  margin-top: 10px;
}

.timelineItem {
  position: relative;
  padding-left: 20px;
  margin-bottom: 15px;
  font-size: 12px;
}

.timelineItem::before {
  content: "";
  position: absolute;
  left: 6px;
  top: 4px;
  width: 8px;
  height: 8px;
  background: #4a90e2;
  border-radius: 50%;
}

.timelineItem::after {
  content: "";
  position: absolute;
  left: 9px;
  top: 14px;
  width: 2px;
  height: calc(100% - 4px);
  background: #ccc;
}

.timelineItem:last-child::after {
  display: none;
}

.timelineText {
  font-size: 12px;
  color: #333;
  margin-bottom: 3px;
}

.timelineDate {
  font-size: 10px;
  color: #777;
}
/* popup end */


 #overlay {
     position:fixed;
     inset:0;
     background:rgba(0,0,0,0.3);
     display:none;
     z-index:1000;
}
 label {
     font-weight:bold;
     display:block;
     margin-top:8px;
     margin-bottom:4px;
}
 input[type="text"], textarea {
     width:100%;
     box-sizing:border-box;
     margin-bottom:6px;
}
 #historyBox {
     max-height:120px;
     overflow-y:auto;
     border:1px solid #ccc;
     padding:5px;
     margin:8px 0;
     font-size:12px;
     background:#fafafa;
}
 button {
     margin-top:6px;
     margin-right:6px;
}

.editableTitle {
  border: none;
  outline: none;
  padding: 6px 0;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.editableTitle:empty:before {
  content: "Tile details";
  color: #999;
}





/* HEADER */
 #topHeader {
     display: flex;
     justify-content: space-between;
     align-items: center;
     background: #ffffff;
     padding: 12px 20px;
     border-bottom: 1px solid #ddd;
     position: sticky;
     top: 0;
     z-index: 2000;
}
 #topHeader .logo {
     font-size: 20px;
     font-weight: bold;
     color: #333;
}
/* PROFILE ICON */
 #profileWrapper {
     position: relative;
}
 #profileIcon {
     width: 32px;
     height: 32px;
     border-radius: 50%;
     cursor: pointer;
}
/* Dropdown menu */
 #profileMenu {
     position: absolute;
     top: 40px;
     right: 0;
     background: white;
     border: 1px solid #ccc;
     border-radius: 8px;
     padding: 10px;
     display: none;
     min-width: 160px;
     box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
 #profileMenu button {
     width: 100%;
     margin: 4px 0;
}
 #profileEmail {
     font-size: 11px;
     color: #666;
     margin-bottom: 6px;
}
/* FOOTER */
 footer {
     margin-top: 40px;
     padding: 20px;
     text-align: center;
     color: #777;
     font-size: 12px;
     border-top: 1px solid #ddd;
}
 
	
  </style>

  <!-- jQuery + jQuery UI (for draggable) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet"
        href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

  <!-- Supabase JS -->
  <script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
</head>

<body>

  <header id="topHeader">
  <div class="left">
    <span class="logo">LifeWorld</span>
  </div>

  <div class="right">
    <div id="profileWrapper">
      <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png"
           id="profileIcon">
      <div id="profileMenu">
        <div id="profileEmail"></div>
        <button id="menuLoginBtn">Login</button>
        <button id="menuLogoutBtn">Logout</button>
      </div>
    </div>
  </div>
</header>


  <input type="text" id="searchBox" placeholder="what's happening?"
         style="margin: 20px 20px 10px 20px; width: 300px; padding:5px;">

  <div id="grid"></div>

  <div id="overlay"></div>

  <div id="popup">
  <h3 id="tileTitle" contenteditable="true" class="editableTitle"></h3>


  <div id="popupContent">
    <div id="popupLeft">
      

      <label>Log Entry</label>
      <textarea id="entryText" rows="4"></textarea>

      <button id="saveBtn">Save</button>
      <button id="cancelBtn">Cancel</button>
    </div>

    <div id="popupRight">
      <h4>History</h4>
      <div id="historyBox"></div>
    </div>
  </div>
</div>


<script>
  // ===== Supabase config (your project) =====
  const SUPABASE_URL = "https://baswgycuhblyppvvdpay.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhc3dneWN1aGJseXBwdnZkcGF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5MjEwMjEsImV4cCI6MjA3OTQ5NzAyMX0.ca23kyoMFHDcTvYRGEd8Dh32Y_3AoHj22-OFVxJZTMY";

  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const TILE_COUNT = 64;

  let currentUser = null;
  let tiles = {};
  let activeIndex = null;

  // ---- Utils ----
  function initEmptyTiles() {
    tiles = {};
    for (let i = 0; i < TILE_COUNT; i++) {
      tiles[i] = { name:"", logs:[], lastUpdate:null };
    }
  }

  function loadWorldFromLocal() {
    const stored = localStorage.getItem("lifeworld");
    if (stored) {
      try {
        tiles = JSON.parse(stored);
      } catch {
        initEmptyTiles();
      }
    } else {
      initEmptyTiles();
    }
  }

  function saveWorldToLocal() {
    localStorage.setItem("lifeworld", JSON.stringify(tiles));
  }

  async function loadWorldFromCloud() {
    if (!currentUser) return;

    const { data, error } = await supa
      .from("worlds")
      .select("data")
      .eq("user_id", currentUser.id)
      .single();

    if (error && error.code !== "PGRST116") {
      console.error("Cloud load error:", error);
      // fallback
      initEmptyTiles();
    } else if (!data) {
      // first time user
      initEmptyTiles();
      await saveWorldToCloud();
    } else {
      tiles = data.data;
      // if something off, ensure structure
      if (!tiles || typeof tiles !== "object") {
        initEmptyTiles();
      }
    }
    renderTiles();
  }

  async function saveWorldToCloud() {
    if (!currentUser) return;
    const { error } = await supa
      .from("worlds")
      .upsert(
        { user_id: currentUser.id, data: tiles },
        { onConflict: "user_id" }
      );

    if (error) {
      console.error("Cloud save error:", error);
    }
  }

  function saveWorld() {
    if (currentUser) {
      saveWorldToCloud();
    } else {
      saveWorldToLocal();
    }
  }

  // ---- Tile rendering & coloring ----
  function updateTileColor(i) {
    let count = tiles[i].logs.length;
    let $tile = $(`.tile[data-index='${i}']`);

    if (count === 0) {
	  $tile.css("background", "#F5F5F0");   // same pale gray as default
	}
    else if (count >= 1 && count <= 3) {
      $tile.css("background", "#F5CBCB"); // pastel pink
    }
    else if (count >= 4 && count <= 8) {
      $tile.css("background", "#c7f7c0"); // soft green
    }
    else if (count >= 9 && count <= 15) {
      $tile.css("background", "#b6d9ff"); // soft blue
    }
    else if (count > 15) {
      $tile.css("background", "linear-gradient(135deg, #ff9a9e, #fad0c4)");
    }
  }

  function renderTiles() {
    $("#grid").empty();

    for (let i = 0; i < TILE_COUNT; i++) {
      const t = tiles[i];
      $("#grid").append(`
        <div class="tile" data-index="${i}">
          <div class="tileName">${t.name || ""}</div>
          <div class="count">${t.logs.length > 0 ? t.logs.length : ""}</div>
          <div class="timestamp">${t.lastUpdate || ""}</div>
        </div>
      `);
      updateTileColor(i);
    }

    initDragAndDrop();
    applySearchFilter();
  }

  function initDragAndDrop() {
    $(".tile").draggable({
      revert: "invalid",
      start: function() {
        $(this).css("z-index", 9999);
      },
      stop: function() {
        $(this).css("z-index", "");
      }
    });

    $(".tile").droppable({
      drop: function(event, ui) {
        let from = $(ui.draggable).data("index");
        let to = $(this).data("index");
        if (from === to) return;
        swapTiles(from, to);
        renderTiles();
      }
    });
  }

  function swapTiles(a, b) {
    let temp = tiles[a];
    tiles[a] = tiles[b];
    tiles[b] = temp;
    saveWorld();
  }

  // Update just one tile UI (for future use if needed)
  function updateTileUI(i) {
    let t = tiles[i];
    let tile = $(`.tile[data-index='${i}']`);
    tile.find(".tileName").text(t.name || "");
    tile.find(".count").text(t.logs.length);
    tile.find(".timestamp").text(t.lastUpdate || "");
    updateTileColor(i);
  }

  // ---- Search ----
  function applySearchFilter() {
    let q = $("#searchBox").val().toLowerCase().trim();
    if (q === "") {
      $(".tile").show();
      return;
    }

    for (let i = 0; i < TILE_COUNT; i++) {
      let t = tiles[i];
      let nameMatch = (t.name || "").toLowerCase().includes(q);
      let logsMatch = t.logs.some(log => log.toLowerCase().includes(q));
      if (nameMatch || logsMatch) {
        $(`.tile[data-index='${i}']`).show();
      } else {
        $(`.tile[data-index='${i}']`).hide();
      }
    }
  }

  $("#searchBox").on("keyup", function() {
    applySearchFilter();
  });

  // ---- Popup / tile click ----
  $(document).on("click", ".tile", function() {
    activeIndex = $(this).data("index");

	$("#tileTitle").text(tiles[activeIndex].name || "Tile details");	
    $("#entryText").val("");

    // Show history
    let logs = tiles[activeIndex].logs;
    if (logs.length > 0) {
  $("#historyBox").html(
    logs.map((item) => `
      <div class="timelineItem">
        <div class="timelineText">${item}</div>
        <div class="timelineDate">${tiles[activeIndex].lastUpdate || ""}</div>
      </div>
    `).join("")
  );
} else {
  $("#historyBox").html("<div style='color:#888;'>No history yet</div>");
}

    $("#overlay").show();
    $("#popup").show();

    // Smart focus
    if (!tiles[activeIndex].name || tiles[activeIndex].name.trim() === "") {
      $("#tileNameInput").focus();
    } else {
      $("#entryText").focus();
    }
  });

  $("#saveBtn").on("click", function() {
    if (activeIndex === null) return;

    let name = $("#tileTitle").text().trim();
	tiles[activeIndex].name = name;

    let txt  = $("#entryText").val().trim();


    if (txt.length > 0) {
      tiles[activeIndex].logs.push(txt);
    }

    let now = new Date().toLocaleString();
    tiles[activeIndex].lastUpdate = now;

    saveWorld();
    renderTiles();

    $("#popup").hide();
    $("#overlay").hide();
    $("#historyBox").empty();
  });

  $("#cancelBtn").on("click", function() {
    $("#popup").hide();
    $("#overlay").hide();
    $("#historyBox").empty();
  });

  // ---- Auth ----
  async function checkAuth() {
    const { data } = await supa.auth.getUser();
    if (data.user) {
      currentUser = data.user;
      $("#userInfo").text(`Logged in as ${currentUser.email}`);
      $("#loginBtn").hide();
      $("#logoutBtn").show();
      await loadWorldFromCloud();
    } else {
      currentUser = null;
      $("#userInfo").text("Not logged in (using local storage)");
      $("#loginBtn").show();
      $("#logoutBtn").hide();
      loadWorldFromLocal();
      renderTiles();
    }
  }

  $("#loginBtn").on("click", async () => {
    const { error } = await supa.auth.signInWithOAuth({
      provider: "google"
    });
    if (error) {
      console.error(error);
      alert("Login failed");
    }
  });

  $("#logoutBtn").on("click", async () => {
    await supa.auth.signOut();
    currentUser = null;
    loadWorldFromLocal();
    renderTiles();
    checkAuth();
  });

  supa.auth.onAuthStateChange((_event, _session) => {
    checkAuth();
  });

  // ---- Init ----
  $(document).ready(function() {
    checkAuth();
  });
  
  
  // PROFILE MENU TOGGLE
$("#profileIcon").on("click", function () {
  $("#profileMenu").toggle();
});

// Close when clicking outside
$(document).on("click", function (e) {
  if (!$(e.target).closest("#profileWrapper").length) {
    $("#profileMenu").hide();
  }
});

// Replace old login/logout buttons
$("#menuLoginBtn").on("click", () => $("#loginBtn").click());
$("#menuLogoutBtn").on("click", () => $("#logoutBtn").click());

// Update profile UI on auth change
function updateProfileUI() {
  if (currentUser) {
    $("#profileEmail").text(currentUser.email);
    $("#menuLoginBtn").hide();
    $("#menuLogoutBtn").show();
  } else {
    $("#profileEmail").text("Guest");
    $("#menuLoginBtn").show();
    $("#menuLogoutBtn").hide();
  }
}

// Hook into your existing checkAuth()
const originalCheck = checkAuth;
checkAuth = async function() {
  await originalCheck();
  updateProfileUI();
};

// ESC closes popup
$(document).on("keydown", function (e) {
  if (e.key === "Escape") {
    if ($("#popup").is(":visible")) {
      $("#cancelBtn").click();
    }
  }
});

// Click outside popup closes it
$(document).on("mousedown", function (e) {
  const popup = $("#popup");

  // if popup is not visible, do nothing
  if (!popup.is(":visible")) return;

  // if click is inside popup → ignore
  if ($(e.target).closest("#popup").length > 0) return;

  // otherwise → behave as cancel
  $("#cancelBtn").click();
});

</script>
<footer>
  Lifeworld v0.3 — built with ❤️
</footer>

</body>
</html>
