name: Build Android APK

on:
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches: [main]
    paths:                  # only rebuild when something app-relevant changes
      - 'capacitor.config.ts'
      - 'package.json'
      - 'www/**'
      - 'logo.png'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Generate native Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Generate app icons + splash from logo
        run: |
          mkdir -p assets
          cp logo.png assets/logo.png
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#f8fafc' --iconBackgroundColorDark '#0f172a' \
            --splashBackgroundColor '#f8fafc' --splashBackgroundColorDark '#0f172a'

      - name: Add deep-link intent filter (for OAuth redirect)
        run: node scripts/patch-android-manifest.mjs

      - name: Bump compileSdk/AGP for social-login deps
        run: node scripts/patch-android-build.mjs

      - name: Decode signing keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lifeworld.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/lifeworld.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifeworld-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
