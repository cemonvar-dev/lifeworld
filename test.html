
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LifeWorld – Gallery</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
	<script src="supa.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
	<main class="max-w-4xl mx-auto p-4">
		<header class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 sticky top-0 bg-slate-50 z-40 py-4 -mt-4">
			<div class="flex items-center gap-3">
				<img src="logo.png" alt="LifeWorld logo" class="h-10 w-10 rounded-lg" />
				<span class="text-2xl font-bold">LifeWorld</span>
			</div>
			<div class="flex items-center gap-2 w-full sm:w-auto">
				<button id="addTileBtn" class="text-blue-500 hover:text-blue-700 text-2xl font-bold transition leading-none">+</button>
				<input type="text" id="searchBox" class="rounded-xl border p-2 w-full sm:w-64" placeholder="Search tiles..." />
				<button id="tagFilterBtn" class="flex items-center gap-1 px-3 py-2 rounded-xl border bg-white hover:bg-slate-100 transition text-sm font-medium whitespace-nowrap">
					🏷️ Tags
				</button>
			</div>
		</header>
		<hr class="mb-4 border-slate-200 sticky top-[72px] z-40 bg-slate-50">
		<div id="activeFilterBar" class="hidden mb-4 flex items-center gap-2">
			<span id="activeFilterLabel" class="text-sm font-semibold text-slate-600"></span>
			<button id="clearFilterBtn" class="text-xs px-2 py-0.5 rounded-full bg-slate-200 hover:bg-slate-300 transition">✕ Clear</button>
		</div>
		<section>
			<div id="gallery" class="flex flex-col"></div>
		</section>
	</main>

	<!-- Tag Filter Popup -->
	<div id="tagFilterOverlay" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center">
		<div class="bg-white rounded-2xl shadow-2xl w-[90%] max-w-md p-6 relative">
			<button id="closeTagFilter" class="absolute top-3 right-4 text-2xl text-slate-400 hover:text-slate-700">&times;</button>
			<div class="text-lg font-bold mb-4">Filter by Tag</div>
			<div id="tagFilterGrid" class="grid grid-cols-2 gap-3"></div>
		</div>
	</div>

	<!-- Tile Detail Popup -->
	<div id="tileOverlay" class="fixed inset-0 bg-black/40 z-50 hidden flex items-start justify-center pt-[5vh] overflow-y-auto">
		<div id="tilePopup" class="bg-white rounded-2xl shadow-2xl w-[90%] max-w-lg p-6 relative mb-10">
			<button id="closePopup" class="absolute top-3 right-4 text-2xl text-slate-400 hover:text-slate-700">&times;</button>
			<div id="popupBody"></div>
		</div>
	</div>
	<script src="testscript.js"></script>
</body>
</html>
