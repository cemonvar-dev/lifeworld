
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LifeWorld – Gallery</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
	<script src="supa.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
	<main class="max-w-4xl mx-auto p-4">
		<header class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
			<div class="flex items-center gap-3">
				<img src="logo.png" alt="LifeWorld logo" class="h-10 w-10 rounded-lg" />
				<span class="text-2xl font-bold">LifeWorld</span>
			</div>
			<input type="text" id="searchBox" class="rounded-xl border p-2 w-full sm:w-64" placeholder="Search tiles..." />
		</header>
		<section>
			<div id="gallery" class="flex flex-col"></div>
		</section>
	</main>

	<!-- Tile Detail Popup -->
	<div id="tileOverlay" class="fixed inset-0 bg-black/40 z-50 hidden flex items-start justify-center pt-[5vh] overflow-y-auto">
		<div id="tilePopup" class="bg-white rounded-2xl shadow-2xl w-[90%] max-w-lg p-6 relative mb-10">
			<button id="closePopup" class="absolute top-3 right-4 text-2xl text-slate-400 hover:text-slate-700">&times;</button>
			<div id="popupBody"></div>
		</div>
	</div>
	<script src="testscript.js"></script>
</body>
</html>
