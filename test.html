
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LifeWorld – Gallery</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
	<script src="supa.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
	<main class="max-w-7xl mx-auto p-4">
		<header class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 sticky top-0 bg-slate-50 z-40 py-4 -mt-4">
			<div class="flex items-center gap-3">
				<img src="logo.png" alt="LifeWorld logo" class="h-10 w-10 rounded-lg" />
				<span class="text-2xl font-bold">LifeWorld</span>
			</div>
			<div class="flex items-center gap-2 w-full sm:w-auto">
				<button id="addTileBtn" class="text-blue-500 hover:text-blue-700 text-4xl font-black transition leading-none">+</button>
				<input type="text" id="searchBox" class="rounded-xl border p-2 w-full sm:w-64" placeholder="Search tiles..." />
				<button id="todayFilterBtn" class="flex items-center gap-1 px-3 py-2 rounded-xl border bg-white hover:bg-slate-100 transition text-sm font-medium whitespace-nowrap">
					📅 Today
				</button>
				<button id="statusFilterBtn" class="flex items-center gap-1 px-3 py-2 rounded-xl border bg-white hover:bg-slate-100 transition text-sm font-medium whitespace-nowrap">
					⭐ All
				</button>
				<button id="tagFilterBtn" class="flex items-center gap-1 px-3 py-2 rounded-xl border bg-white hover:bg-slate-100 transition text-sm font-medium whitespace-nowrap">
					🏷️ Tags
				</button>
				<button id="resetBtn" class="flex items-center gap-1 px-3 py-2 rounded-xl border bg-white hover:bg-red-50 text-red-400 hover:text-red-600 transition text-sm font-medium whitespace-nowrap">
					🔄 Reset
				</button>
				<button id="lifecycleFilterBtn" class="flex items-center gap-1 px-3 py-2 rounded-xl border bg-blue-50 border-blue-300 text-blue-700 transition text-sm font-medium whitespace-nowrap">
					📊 Active
				</button>
				<button id="aiChatBtn" class="flex items-center gap-1 px-3 py-2 rounded-xl border bg-purple-50 border-purple-300 text-purple-700 hover:bg-purple-100 transition text-sm font-medium whitespace-nowrap">
					🤖 AI
				</button>
			</div>
		</header>
		<hr class="mb-4 border-slate-200 sticky top-[72px] z-40 bg-slate-50">
		<div id="activeFilterBar" class="hidden mb-4 flex items-center gap-2">
			<span id="activeFilterLabel" class="text-sm font-semibold text-slate-600"></span>
			<button id="clearFilterBtn" class="text-xs px-2 py-0.5 rounded-full bg-slate-200 hover:bg-slate-300 transition">✕ Clear</button>
		</div>
		<section>
			<div id="gallery" class="flex flex-col"></div>
		</section>
	</main>

	<!-- Tag Filter Popup -->
	<div id="tagFilterOverlay" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center">
		<div class="bg-white rounded-2xl shadow-2xl w-[95%] max-w-2xl max-h-[80vh] flex flex-col p-5 relative">
			<button id="closeTagFilter" class="absolute top-3 right-4 text-2xl text-slate-400 hover:text-slate-700">&times;</button>
			<div class="text-lg font-bold mb-3">Filter by Tag</div>
			<div id="tagFilterGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-2 overflow-y-auto"></div>
		</div>
	</div>

	<!-- Tile Detail Popup -->
	<div id="tileOverlay" class="fixed inset-0 bg-black/40 z-50 hidden flex items-start justify-center pt-[5vh] overflow-y-auto">
		<div id="tilePopup" class="bg-white rounded-2xl shadow-2xl w-[90%] max-w-lg p-6 relative mb-10">
			<button id="closePopup" class="absolute top-3 right-4 text-2xl text-slate-400 hover:text-slate-700">&times;</button>
			<div id="popupBody"></div>
		</div>
	</div>

	<!-- Add Log Popup -->
	<div id="addLogOverlay" class="fixed inset-0 bg-black/40 z-[60] hidden flex items-center justify-center">
		<div class="bg-white rounded-2xl shadow-2xl w-[90%] max-w-sm p-6 relative">
			<button id="closeAddLog" class="absolute top-3 right-4 text-2xl text-slate-400 hover:text-slate-700">&times;</button>
			<div class="text-lg font-bold mb-4">Add Log</div>
			<div class="mb-3">
				<label class="text-xs text-slate-500 mb-1 block">Status</label>
				<div id="logStatusBtns" class="flex gap-2">
					<button class="log-status-btn flex-1 py-1.5 rounded-lg text-xs font-semibold border bg-green-50 text-green-700 border-green-300 transition" data-status="done">✅ Done</button>
					<button class="log-status-btn flex-1 py-1.5 rounded-lg text-xs font-semibold border bg-white text-yellow-600 border-slate-200 transition" data-status="skipped">⏭️ Skip</button>
				</div>
			</div>
			<div class="mb-3">
				<label class="text-xs text-slate-500 mb-1 block">Date</label>
				<input type="date" id="logDateInput" class="w-full rounded-lg border px-3 py-2 text-sm" />
			</div>
			<div class="mb-4">
				<label class="text-xs text-slate-500 mb-1 block">Note</label>
				<textarea id="logNoteInput" rows="3" class="w-full rounded-lg border px-3 py-2 text-sm resize-none" placeholder="Add a note..."></textarea>
			</div>
			<button id="submitLogBtn" class="w-full py-2 rounded-lg bg-blue-500 text-white text-sm font-semibold hover:bg-blue-600 transition">➕ Add Log</button>
		</div>
	</div>
	<script src="testscript.js"></script>

	<!-- AI Chat Popup -->
	<div id="aiChatOverlay" class="fixed inset-0 bg-black/40 z-[70] hidden flex items-end sm:items-center justify-center">
		<div class="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full sm:w-[420px] max-h-[85vh] flex flex-col relative">
			<div class="flex items-center justify-between p-4 border-b">
				<div class="flex items-center gap-2">
					<span class="text-xl">🤖</span>
					<span class="font-bold text-lg">LifeWorld AI</span>
				</div>
				<div class="flex items-center gap-2">
					<button id="clearChatBtn" class="text-xs px-2 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 transition" title="Clear chat">🗑️</button>
					<button id="closeAiChat" class="text-2xl text-slate-400 hover:text-slate-700 leading-none">&times;</button>
				</div>
			</div>
			<div id="aiChatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 min-h-[200px] max-h-[60vh]"></div>
			<div class="p-3 border-t flex gap-2">
				<input type="text" id="aiChatInput" class="flex-1 rounded-xl border px-3 py-2 text-sm" placeholder="Ask me anything about your tasks..." />
				<button id="aiSendBtn" class="px-4 py-2 rounded-xl bg-purple-500 text-white text-sm font-semibold hover:bg-purple-600 transition">Send</button>
			</div>
			<div class="px-4 pb-2">
				<div class="flex flex-wrap gap-1">
					<button class="ai-quick-prompt text-xs px-2 py-1 rounded-full bg-purple-50 text-purple-600 hover:bg-purple-100 transition" data-prompt="How am I doing overall?">📊 Overview</button>
					<button class="ai-quick-prompt text-xs px-2 py-1 rounded-full bg-purple-50 text-purple-600 hover:bg-purple-100 transition" data-prompt="Which tasks need the most attention?">🔥 Needs attention</button>
					<button class="ai-quick-prompt text-xs px-2 py-1 rounded-full bg-purple-50 text-purple-600 hover:bg-purple-100 transition" data-prompt="Give me a motivational message based on my progress">💪 Motivate me</button>
					<button class="ai-quick-prompt text-xs px-2 py-1 rounded-full bg-purple-50 text-purple-600 hover:bg-purple-100 transition" data-prompt="Suggest improvements to my schedule">📅 Schedule tips</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
