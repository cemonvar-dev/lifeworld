<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#f8fafc">
	<title>LifeWorld</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
	<script src="https://unpkg.com/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
	<script src="supa.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		html, body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
		/* Modal entrance animations — fire whenever an overlay loses .hidden */
		@keyframes lwFade { from { opacity: 0; } to { opacity: 1; } }
		@keyframes lwPop {
			from { opacity: 0; transform: translateY(14px) scale(.97); }
			to   { opacity: 1; transform: translateY(0) scale(1); }
		}
		[id$="Overlay"]:not(.hidden) { animation: lwFade .2s ease-out; }
		[id$="Overlay"]:not(.hidden) > div { animation: lwPop .28s cubic-bezier(.2,.8,.2,1); }
		/* Refined scrollbars */
		* { scrollbar-width: thin; scrollbar-color: rgba(100,116,139,.35) transparent; }
		*::-webkit-scrollbar { width: 8px; height: 8px; }
		*::-webkit-scrollbar-thumb { background: rgba(100,116,139,.30); border-radius: 9999px; }
		*::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,.5); }
		*::-webkit-scrollbar-track { background: transparent; }
		/* Tile status line ("take action now (n)"): hidden, fades in after a short
		   hover dwell so the card stays clean until you pause on it. */
		.tile .tile-status-line { opacity: 0; transition: opacity .25s ease; transition-delay: 0s; }
		.tile:hover .tile-status-line { opacity: 1; transition-delay: 1.2s; }
		/* Add-log calendar: tint days that already have a log (selection still wins) */
		.flatpickr-day.lw-day-done:not(.selected) { background: rgba(34,197,94,.18); border-color: rgba(34,197,94,.30); color: #166534; font-weight: 600; }
		.flatpickr-day.lw-day-done:not(.selected):hover { background: rgba(34,197,94,.30); }
		.flatpickr-day.lw-day-skip:not(.selected) { background: rgba(234,179,8,.20); border-color: rgba(234,179,8,.35); color: #854d0e; font-weight: 600; }
		.flatpickr-day.lw-day-skip:not(.selected):hover { background: rgba(234,179,8,.32); }

		/* Mobile hamburger menu → clean vertical list (desktop keeps the pill row) */
		@media (max-width: 639px) {
			#navMenu {
				flex-direction: column;
				align-items: stretch;
				gap: 6px;
				margin-top: 10px;
				padding: 8px;
				background: rgba(255,255,255,.92);
				-webkit-backdrop-filter: blur(12px);
				backdrop-filter: blur(12px);
				border: 1px solid rgba(226,232,240,.9);
				border-radius: 18px;
				box-shadow: 0 14px 34px rgba(15,23,42,.10);
			}
			#navMenu > button,
			#navMenu #todaySummaryBtn {
				width: 100%;
				justify-content: flex-start;
				text-align: left;
				border-radius: 12px !important;
				padding: 12px 16px !important;
				font-size: .95rem;
				box-shadow: none !important;
				transform: none !important;
			}
			#navMenu #todaySummaryWrapper { width: 100%; }
			/* Submenu keeps its own layout (count badge stays right-aligned) */
			#navMenu #todaySummaryMenu { position: static; width: 100%; margin-top: 6px; box-shadow: none; }
		}

		/* Filter modal: stack the relocated pills as a full-width left-aligned list */
		#filterMenuList > button {
			width: 100%;
			justify-content: flex-start;
			text-align: left;
			border-radius: 12px !important;
			padding: 12px 16px !important;
			transform: none !important;
		}
	</style>
</head>
<body class="min-h-screen text-slate-900 antialiased bg-gradient-to-b from-indigo-50/50 via-slate-50 to-slate-100">

	<!-- Ambient gradient backdrop -->
	<div aria-hidden="true" class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
		<div class="absolute -top-32 -left-24 h-96 w-96 rounded-full bg-blue-300/30 blur-3xl"></div>
		<div class="absolute top-1/3 -right-24 h-[28rem] w-[28rem] rounded-full bg-fuchsia-300/20 blur-3xl"></div>
		<div class="absolute bottom-0 left-1/3 h-80 w-80 rounded-full bg-amber-200/25 blur-3xl"></div>
	</div>

	<main class="max-w-[1800px] mx-auto p-4">

		<header class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 sticky top-3 z-40 rounded-2xl bg-white/70 backdrop-blur-xl border border-white/60 shadow-lg shadow-slate-900/5 px-4 py-3">
			<div class="flex items-center justify-between gap-3 w-full sm:w-auto">
				<div class="flex items-center gap-3">
					<img src="logo.png" alt="LifeWorld logo" class="h-10 w-10 rounded-xl shadow-sm ring-1 ring-black/5" />
					<span class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-slate-900 to-slate-500 bg-clip-text text-transparent">LifeWorld</span>
				</div>
				<button id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navMenu" class="sm:hidden grid place-items-center h-10 w-10 rounded-full border border-slate-200/80 bg-white/70 backdrop-blur text-slate-700 text-xl shadow-sm transition hover:bg-white active:scale-95">☰</button>
			</div>
			<div class="flex items-center gap-2 w-full sm:w-auto">
				<button id="addTileBtn" aria-label="Add tile" title="Add tile" class="grid place-items-center h-10 w-10 shrink-0 rounded-full bg-gradient-to-br from-blue-500 to-indigo-500 text-white text-2xl font-light leading-none shadow-md shadow-blue-500/30 hover:shadow-lg hover:shadow-blue-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200">+</button>
				<input type="text" id="searchBox" aria-label="Search tiles" class="rounded-full border border-slate-200/80 bg-white/70 backdrop-blur px-4 py-2 w-full sm:w-64 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-400/40 focus:border-blue-300 transition" placeholder="Search tiles..." />
			</div>
			<div id="navMenu" class="hidden sm:flex flex-col sm:flex-row flex-wrap items-stretch sm:items-center justify-center gap-2 w-full sm:w-auto">
				<button id="calendarMenuBtn" title="Calendar" aria-label="Calendar" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium whitespace-nowrap border border-amber-200/80 bg-amber-50/80 text-amber-700 shadow-sm transition-all duration-200 hover:bg-amber-100/80 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">📆<span class="sm:hidden ml-1">Calendar</span></button>
				<button id="filterMenuBtn" title="Filters" aria-label="Filters" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium whitespace-nowrap border bg-white text-slate-700 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">🔽<span class="sm:hidden ml-1">Filters</span></button>
				<div id="todaySummaryWrapper" class="relative hidden">
					<button id="todaySummaryBtn" data-keep-menu aria-label="Today summary" aria-haspopup="true" aria-expanded="false" title="What's done and what's left today" class="inline-flex items-center justify-center gap-1.5 px-3.5 py-2 w-full sm:w-auto rounded-full text-sm font-medium whitespace-nowrap border bg-white text-slate-700 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">❓<span class="sm:hidden ml-1">Today summary</span></button>
					<div id="todaySummaryMenu" class="hidden absolute right-0 mt-2 w-60 rounded-2xl bg-white shadow-xl shadow-slate-900/10 border border-slate-200/80 p-1.5 z-[55]">
						<button id="todayRemainingBtn" class="w-full flex items-center justify-between gap-2 px-3 py-2 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-100 transition">
							<span>📋 Remaining today</span>
							<span id="todayRemainingCount" class="text-xs font-semibold px-1.5 py-0.5 rounded-full bg-blue-100 text-blue-600">0</span>
						</button>
						<button id="todayDoneBtn" class="w-full flex items-center justify-between gap-2 px-3 py-2 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-100 transition">
							<span>✅ Done / skipped today</span>
							<span id="todayDoneCount" class="text-xs font-semibold px-1.5 py-0.5 rounded-full bg-green-100 text-green-600">0</span>
						</button>
					</div>
				</div>
				<button id="statusFilterBtn" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium whitespace-nowrap border bg-white shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">
					⭐ All
				</button>
				<button id="tagFilterBtn" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium whitespace-nowrap border border-slate-200/80 bg-white/70 backdrop-blur text-slate-600 shadow-sm transition-all duration-200 hover:bg-white hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">
					🏷️ Tags
				</button>
				<button id="freqFilterBtn" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium whitespace-nowrap border bg-white text-slate-700 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">
					🔁 All Freq
				</button>
				<button id="lifecycleFilterBtn" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full border text-sm font-medium whitespace-nowrap shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0 bg-orange-100 text-orange-700 border-orange-300">
					🔥 Active
				</button>
				<button id="moodFilterBtn" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium whitespace-nowrap border bg-white shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">
					🌦️ Mood
				</button>
				<button id="aiChatBtn" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-semibold whitespace-nowrap text-white bg-gradient-to-r from-purple-500 to-fuchsia-500 border border-transparent shadow-md shadow-purple-500/30 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-purple-500/40 active:translate-y-0">
					🤖 AI
				</button>
				<div id="notifWrapper" class="relative">
					<button id="notifBellBtn" data-keep-menu title="Reminders" aria-label="Reminders" aria-haspopup="true" aria-expanded="false" class="relative inline-flex items-center justify-center gap-1.5 px-3.5 py-2 w-full sm:w-auto rounded-full text-sm font-medium whitespace-nowrap border bg-white text-slate-700 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">🔔<span class="sm:hidden ml-1">Reminders</span><span id="notifBadge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold leading-[18px] text-center">0</span></button>
					<div id="notifMenu" class="hidden absolute right-0 mt-2 w-72 rounded-2xl bg-white shadow-xl shadow-slate-900/10 border border-slate-200/80 p-1.5 z-[55]">
						<div class="flex items-center justify-between px-2 py-1.5">
							<span class="text-sm font-semibold text-slate-700">Reminders</span>
							<button id="notifClearAll" class="text-xs text-slate-400 hover:text-red-500 transition">Clear all</button>
						</div>
						<div id="notifList" class="max-h-72 overflow-y-auto"></div>
					</div>
				</div>
				<button id="settingsBtn" title="Settings" aria-label="Settings" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium whitespace-nowrap border bg-white text-slate-700 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">⚙️<span class="sm:hidden ml-1">Settings</span></button>
			</div>
		</header>

		<div id="searchChips" class="hidden mb-4 flex items-center flex-wrap gap-2"></div>

		<!-- Calendar Modal -->
		<div id="calendarOverlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
			<div class="bg-white/90 backdrop-blur-2xl rounded-3xl shadow-2xl shadow-slate-900/10 border border-white/60 w-[95%] max-w-3xl max-h-[90vh] flex flex-col p-6 relative">
				<button id="closeCalendar" aria-label="Close" class="absolute top-3 right-4 grid place-items-center h-9 w-9 rounded-full text-2xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">&times;</button>
				<span class="absolute top-3 left-4 text-2xl">📆</span>
				<div class="text-2xl font-extrabold mb-3 text-center tracking-tight">Planned Tasks</div>
				<div id="calendarContainer" class="overflow-x-auto"></div>
			</div>
		</div>

		<section>
			<div id="gallery" class="flex flex-col"></div>
		</section>
	</main>

	<!-- Tag Filter Popup -->
	<div id="tagFilterOverlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
		<div class="bg-white/90 backdrop-blur-2xl rounded-3xl shadow-2xl shadow-slate-900/10 border border-white/60 w-[95%] max-w-2xl max-h-[80vh] flex flex-col p-5 relative">
			<button id="closeTagFilter" aria-label="Close" class="absolute top-3 right-4 grid place-items-center h-9 w-9 rounded-full text-2xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">&times;</button>
			<span class="absolute top-3 left-4 text-2xl">🏷️</span>
			<div class="text-2xl font-extrabold mb-3 text-center tracking-tight">Filter by Tag</div>
			<div id="tagFilterGrid" class="flex flex-col gap-0.5 overflow-y-auto min-h-[200px] max-h-[60vh] px-2"></div>
		</div>
	</div>

	<!-- Mood Filter Popup -->
	<div id="moodFilterOverlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
		<div class="bg-white/90 backdrop-blur-2xl rounded-3xl shadow-2xl shadow-slate-900/10 border border-white/60 w-[95%] max-w-sm max-h-[80vh] flex flex-col p-5 relative">
			<button id="closeMoodFilter" aria-label="Close" class="absolute top-3 right-4 grid place-items-center h-9 w-9 rounded-full text-2xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">&times;</button>
			<span class="absolute top-3 left-4 text-2xl">🌦️</span>
			<div class="text-2xl font-extrabold mb-3 text-center tracking-tight">Filter by Mood</div>
			<div id="moodFilterGrid" class="flex flex-col gap-1.5 overflow-y-auto px-1"></div>
		</div>
	</div>

	<!-- Today Summary Popup (done/skipped & remaining) -->
	<div id="todaySummaryOverlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
		<div class="bg-white/90 backdrop-blur-2xl rounded-3xl shadow-2xl shadow-slate-900/10 border border-white/60 w-[95%] max-w-md max-h-[80vh] flex flex-col p-5 relative">
			<button id="closeTodaySummary" aria-label="Close" class="absolute top-3 right-4 grid place-items-center h-9 w-9 rounded-full text-2xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">&times;</button>
			<span id="todaySummaryIcon" class="absolute top-3 left-4 text-2xl">📋</span>
			<div id="todaySummaryTitle" class="text-2xl font-extrabold mb-3 text-center tracking-tight">Today</div>
			<div id="todaySummaryBody" class="flex flex-col gap-1 overflow-y-auto min-h-[120px] max-h-[60vh] px-1"></div>
		</div>
	</div>

	<!-- Tile Detail Popup -->
	<div id="tileOverlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 hidden flex items-start justify-center pt-[5vh] overflow-y-auto">
		<div id="tilePopup" class="bg-white/90 backdrop-blur-2xl rounded-3xl shadow-2xl shadow-slate-900/10 border border-white/60 w-[90%] max-w-lg p-6 relative mb-10">
			<button id="closePopup" aria-label="Close" class="absolute top-3 right-4 grid place-items-center h-9 w-9 rounded-full text-2xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">&times;</button>
			<div id="popupBody"></div>
		</div>
	</div>

	<!-- Add Log Popup -->
	<div id="addLogOverlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
		<div class="bg-white/90 backdrop-blur-2xl rounded-3xl shadow-2xl shadow-slate-900/10 border border-white/60 w-[90%] max-w-sm p-6 relative">
			<button id="closeAddLog" aria-label="Close" class="absolute top-3 right-4 grid place-items-center h-9 w-9 rounded-full text-2xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">&times;</button>
			<div class="text-lg font-bold mb-4">Add Log</div>
			<div class="mb-3">
				<label class="text-xs text-slate-500 mb-1 block">Date(s)</label>
				<input type="text" id="logDateInput" placeholder="Select one or more dates" class="w-full rounded-lg border px-3 py-2 text-sm bg-white" />
			</div>
			<div class="mb-4">
				<label class="text-xs text-slate-500 mb-1 block">Note</label>
				<textarea id="logNoteInput" rows="3" class="w-full rounded-lg border px-3 py-2 text-sm resize-none" placeholder="Add a note..."></textarea>
			</div>
			<div id="logStatusBtns" class="flex gap-2">
				<button class="log-status-btn flex-1 py-2 rounded-lg text-sm font-semibold border bg-green-50 text-green-700 border-green-300 transition" data-status="done">✅ Done</button>
				<button class="log-status-btn flex-1 py-2 rounded-lg text-sm font-semibold border bg-white text-yellow-600 border-slate-200 transition" data-status="skipped">⏭️ Skip</button>
			</div>
			<button id="submitLogBtn" class="hidden w-full mt-3 py-2 rounded-xl bg-gradient-to-r from-blue-500 to-indigo-500 text-white text-sm font-semibold shadow-md shadow-blue-500/30 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200">💾 Update Log</button>
		</div>
	</div>

	<!-- Calendar menu (Long-term plan / Today's items / Today's summary) -->
	<div id="calendarMenuOverlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-[65] hidden flex items-center justify-center p-4">
		<div class="bg-white/90 backdrop-blur-2xl rounded-3xl shadow-2xl shadow-slate-900/10 border border-white/60 w-[90%] max-w-sm p-6 relative">
			<button id="closeCalendarMenu" aria-label="Close" class="absolute top-3 right-4 grid place-items-center h-9 w-9 rounded-full text-2xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">&times;</button>
			<span class="absolute top-3 left-4 text-2xl">📆</span>
			<div class="text-2xl font-extrabold mb-5 text-center tracking-tight">Calendar</div>
			<div class="flex flex-col gap-2">
				<button id="longTermPlanBtn" class="w-full flex items-center gap-2 px-4 py-3 rounded-xl text-sm font-semibold border border-amber-200 bg-amber-50 text-amber-700 hover:bg-amber-100 transition">🗓️ Long term plan <span class="text-xs font-normal text-amber-500">(planned calendar)</span></button>
				<button id="todayItemsBtn" class="w-full flex items-center gap-2 px-4 py-3 rounded-xl text-sm font-semibold border bg-white text-slate-700 hover:bg-slate-50 transition">📅 Today's items</button>
				<button id="todaySummaryOpenBtn" class="w-full flex items-center gap-2 px-4 py-3 rounded-xl text-sm font-semibold border bg-white text-slate-700 hover:bg-slate-50 transition">📋 Today's summary</button>
			</div>
		</div>
	</div>

	<!-- Filter menu (the filter pills relocated here) -->
	<div id="filterMenuOverlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-[65] hidden flex items-center justify-center p-4">
		<div class="bg-white/90 backdrop-blur-2xl rounded-3xl shadow-2xl shadow-slate-900/10 border border-white/60 w-[90%] max-w-sm p-6 relative">
			<button id="closeFilterMenu" aria-label="Close" class="absolute top-3 right-4 grid place-items-center h-9 w-9 rounded-full text-2xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">&times;</button>
			<span class="absolute top-3 left-4 text-2xl">🔽</span>
			<div class="text-2xl font-extrabold mb-5 text-center tracking-tight">Filters</div>
			<div id="filterMenuList" class="flex flex-col gap-2"></div>
		</div>
	</div>

	<!-- Settings Popup -->
	<div id="settingsOverlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-[65] hidden flex items-center justify-center p-4">
		<div class="bg-white/90 backdrop-blur-2xl rounded-3xl shadow-2xl shadow-slate-900/10 border border-white/60 w-[90%] max-w-sm p-6 relative">
			<button id="closeSettings" aria-label="Close" class="absolute top-3 right-4 grid place-items-center h-9 w-9 rounded-full text-2xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">&times;</button>
			<span class="absolute top-3 left-4 text-2xl">⚙️</span>
			<div class="text-2xl font-extrabold mb-5 text-center tracking-tight">Settings</div>
			<div class="mb-2">
				<label for="settingsVoiceLang" class="text-sm font-semibold block mb-1">🎙️ Voice language</label>
				<p class="text-xs text-slate-500 mb-2">Language used when dictating tile titles with the mic.</p>
				<select id="settingsVoiceLang" class="w-full rounded-lg border px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400/40 focus:border-blue-300">
					<option value="en-US">English</option>
					<option value="de-DE">Deutsch</option>
					<option value="it-IT">Italiano</option>
					<option value="es-ES">Español</option>
					<option value="tr-TR">Türkçe</option>
				</select>
			</div>
		</div>
	</div>

	<!-- New Tile Popup (type or dictate the title) -->
	<div id="newTileOverlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-[65] hidden flex items-center justify-center p-4">
		<div class="bg-white/90 backdrop-blur-2xl rounded-3xl shadow-2xl shadow-slate-900/10 border border-white/60 w-[90%] max-w-sm p-6 relative">
			<button id="closeNewTile" aria-label="Close" class="absolute top-3 right-4 grid place-items-center h-9 w-9 rounded-full text-2xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">&times;</button>
			<div class="text-lg font-bold mb-4">New Tile</div>
			<div class="flex items-center gap-2 mb-2">
				<input type="text" id="newTileInput" placeholder="Tile name…" autocomplete="off" class="flex-1 rounded-lg border px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400/40 focus:border-blue-300 transition" />
				<button id="newTileMicBtn" aria-label="Speak the title" title="Speak the title" class="grid place-items-center h-10 w-10 shrink-0 rounded-full border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 active:scale-95 transition">
					<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<rect x="9" y="2" width="6" height="12" rx="3" />
						<path d="M5 10v2a7 7 0 0 0 14 0v-2" />
						<line x1="12" y1="19" x2="12" y2="22" />
						<line x1="8" y1="22" x2="16" y2="22" />
					</svg>
				</button>
			</div>
			<div id="newTileMicStatus" class="hidden text-xs mb-3"></div>
			<button id="createNewTileBtn" class="w-full mt-2 py-2 rounded-xl bg-gradient-to-r from-blue-500 to-indigo-500 text-white text-sm font-semibold shadow-md shadow-blue-500/30 hover:-translate-y-0.5 active:translate-y-0 transition-all">➕ Create</button>
		</div>
	</div>

	<!-- AI Chat Popup -->
	<div id="aiChatOverlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-[70] hidden flex items-end sm:items-center justify-center">
		<div class="bg-white/90 backdrop-blur-2xl shadow-2xl shadow-slate-900/20 border border-white/60 rounded-t-3xl sm:rounded-3xl w-full sm:w-[420px] max-h-[85vh] flex flex-col relative">
			<div class="flex items-center justify-between p-4 border-b border-slate-200/70">
				<div class="flex items-center gap-2">
					<span class="grid place-items-center h-9 w-9 rounded-full bg-gradient-to-br from-purple-500 to-fuchsia-500 text-white text-lg shadow-sm shadow-purple-500/30">🤖</span>
					<span class="font-bold text-lg tracking-tight">LifeWorld AI</span>
				</div>
				<div class="flex items-center gap-2">
					<button id="clearChatBtn" aria-label="Clear chat" class="text-xs px-2 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 transition" title="Clear chat">🗑️</button>
					<button id="closeAiChat" aria-label="Close" class="grid place-items-center h-8 w-8 rounded-full text-2xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 leading-none transition">&times;</button>
				</div>
			</div>
			<div id="aiChatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 min-h-[200px] max-h-[60vh]"></div>
			<div class="p-3 border-t border-slate-200/70 flex gap-2">
				<input type="text" id="aiChatInput" aria-label="Message" class="flex-1 rounded-full border border-slate-200/80 bg-white/70 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400/40 focus:border-purple-300 transition" placeholder="Ask me anything about your tasks..." />
				<button id="aiSendBtn" class="px-4 py-2 rounded-full bg-gradient-to-r from-purple-500 to-fuchsia-500 text-white text-sm font-semibold shadow-md shadow-purple-500/30 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200">Send</button>
			</div>
			<div class="px-4 pb-3">
				<div class="flex flex-wrap gap-1.5">
					<button class="ai-quick-prompt text-xs px-3 py-1.5 rounded-full bg-purple-50 text-purple-600 hover:bg-purple-100 transition" data-prompt="How am I doing overall?">📊 Overview</button>
					<button class="ai-quick-prompt text-xs px-3 py-1.5 rounded-full bg-purple-50 text-purple-600 hover:bg-purple-100 transition" data-prompt="Which tasks need the most attention?">🔥 Needs attention</button>
					<button class="ai-quick-prompt text-xs px-3 py-1.5 rounded-full bg-purple-50 text-purple-600 hover:bg-purple-100 transition" data-prompt="Give me a motivational message based on my progress">💪 Motivate me</button>
					<button class="ai-quick-prompt text-xs px-3 py-1.5 rounded-full bg-purple-50 text-purple-600 hover:bg-purple-100 transition" data-prompt="Suggest improvements to my schedule">📅 Schedule tips</button>
				</div>
			</div>
		</div>
	</div>

	<script src="lifeworld.js?v=0.4.2"></script>
